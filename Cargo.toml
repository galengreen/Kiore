[workspace]
resolver = "3"
members = ["crates/*", "research/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.8"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
